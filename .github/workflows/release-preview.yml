name: Release - Dry Run Preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref or commit to preview as the next stable release candidate'
        required: false
        default: develop
        type: string

jobs:
  preview:
    name: Preview Next Stable Release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Prepare Stable Release Preview
        run: |
          set -eu

          git fetch origin --tags --force

          last_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"

          if [ -n "$last_tag" ]; then
            range="${last_tag}..HEAD"
          else
            range="HEAD"
          fi

          echo "Previewing release candidate range ${range}"
          {
            echo "## Stable Release Preview"
            echo
            echo "- Release branch: \`develop\`"
            echo "- Candidate ref: \`$(git rev-parse --short HEAD)\`"
            echo "- Last release tag: \`${last_tag:-none}\`"
            echo "- Range: \`${range}\`"
            echo
            echo "### Included Commits"
            git log --reverse --no-merges --pretty='- %h %s' "$range" || true
          } >> "$GITHUB_STEP_SUMMARY"

          # semantic-release only publishes from its configured branch, so put the
          # candidate ref on a local develop branch before the dry run.
          git checkout -B develop "$(git rev-parse HEAD)"

      - name: Install just
        uses: taiki-e/install-action@a1df9120380005ebdc788c62449b841b205541dd # v2.71.0
        with:
          tool: just

      - name: Set Up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack yarn --version

      - name: Install Release Tooling Dependencies
        run: just release install

      - name: Run semantic-release Dry Run
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN != '' && secrets.RELEASE_BOT_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN != '' && secrets.RELEASE_BOT_TOKEN || github.token }}
        run: just release preview | tee semantic-release-preview.log

      - name: Upload Preview Output
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: semantic-release-preview
          path: semantic-release-preview.log
          retention-days: 14
