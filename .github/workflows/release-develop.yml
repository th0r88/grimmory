name: Release - Semantic Stable

# Releases are cut from develop, which is this repository's trunk and default
# branch. This workflow deliberately does not re-run the migration check or the
# test suite: it is chained off "CI - Validate", which already runs both on every
# push to develop, and only proceeds when that run succeeded.
on:
  workflow_run:
    workflows: ["CI - Validate"]
    types:
      - completed
    branches:
      - develop

concurrency:
  group: release-develop
  cancel-in-progress: false

jobs:
  semantic-release:
    name: Compute Release, Update Changelog, and Draft GitHub Release
    # Skip release commits so semantic-release does not chase its own tail, and
    # only release when the validating run actually passed.
    if: >-
      ${{ github.event.workflow_run.event == 'push'
          && github.event.workflow_run.conclusion == 'success'
          && !contains(github.event.workflow_run.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    outputs:
      released: ${{ steps.release_state.outputs.released }}
      release_tag: ${{ steps.release_state.outputs.release_tag }}
      release_sha: ${{ steps.release_state.outputs.release_sha }}

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # semantic-release refuses to publish from a detached HEAD, so check out
          # the branch itself rather than the validated SHA.
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Validated Commit Is Still Current
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          head_sha="$(git rev-parse HEAD)"

          if [ "$head_sha" != "$VALIDATED_SHA" ]; then
            echo "develop has moved from $VALIDATED_SHA to $head_sha since validation." >&2
            echo "Releasing the current tip; the newer commits will be validated by their own run." >&2
          fi

      - name: Install just
        uses: taiki-e/install-action@a1df9120380005ebdc788c62449b841b205541dd # v2.71.0
        with:
          tool: just

      - name: Set Up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack yarn --version

      - name: Install Release Tooling Dependencies
        run: just release install

      - name: Record Pre-Release HEAD
        id: pre_release
        run: |
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure Release Bot Git Identity
        env:
          RELEASE_GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN != '' && secrets.RELEASE_BOT_TOKEN || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${RELEASE_GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN != '' && secrets.RELEASE_BOT_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN != '' && secrets.RELEASE_BOT_TOKEN || github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: just release run

      - name: Capture Release State
        id: release_state
        run: |
          set -eu
          head_before="${{ steps.pre_release.outputs.head_sha }}"
          head_after="$(git rev-parse HEAD)"

          echo "release_sha=$head_after" >> "$GITHUB_OUTPUT"

          if [ "$head_after" = "$head_before" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_tag="$(git tag --points-at "$head_after" 'v*' | sort -V | tail -n 1)"

          if [ -z "$release_tag" ]; then
            echo "semantic-release advanced HEAD without creating a release tag" >&2
            exit 1
          fi

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  publish-release:
    name: Publish Stable Images
    if: ${{ needs.semantic-release.outputs.released == 'true' }}
    needs: [semantic-release]
    uses: ./.github/workflows/publish-release.yml
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      release_tag: ${{ needs.semantic-release.outputs.release_tag }}
      commit_sha: ${{ needs.semantic-release.outputs.release_sha }}
